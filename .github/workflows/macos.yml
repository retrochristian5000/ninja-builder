name: macOS

on:
  pull_request:
  push:
    branches: ['**']
    tags-ignore: ['**']  # Don't trigger on tag pushes
  release:
    types: [published]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: macos-14

    steps:
    - uses: actions/checkout@v7

    - name: Install dependencies
      run: brew install re2c

    - name: Build ninja
      shell: bash
      env:
        MACOSX_DEPLOYMENT_TARGET: 10.15
      run: |
        cmake -Bbuild -GXcode '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_COMPILE_WARNING_AS_ERROR=1
        cmake --build build --config Release

    - name: Test ninja (Release)
      run: ./ninja_test
      working-directory: build/Release

    - name: Verify Darwin automatic parallelism
      shell: bash
      working-directory: build/Release
      run: |
        active="$(sysctl -n hw.activecpu)"
        tiers="$(sysctl -n hw.nperflevels 2>/dev/null || printf '1')"
        if [[ "$tiers" -gt 1 ]]; then
          output="$(env -u NINJA_AUTO_JOBS ./ninja -h 2>&1 || true)"
          grep -Fq "[default=$active on this system]" <<< "$output"
        fi
        output="$(NINJA_AUTO_JOBS=1 ./ninja -h 2>&1 || true)"
        grep -Fq '[default=1 on this system]' <<< "$output"
        output="$(NINJA_AUTO_JOBS=1 ./ninja -j 3 -h 2>&1 || true)"
        grep -Fq '[default=3 on this system]' <<< "$output"

    - name: Create ninja archive
      shell: bash
      run: |
        mkdir artifact
        7z a artifact/ninja-mac.zip ./build/Release/ninja

    # Upload ninja binary archive as an artifact
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ninja-binary-archives
        path: artifact

    - name: Upload release asset
      if: github.event.action == 'published'
      uses: ncipollo/release-action@v1
      with:
        allowUpdates: true # if release exists it will edit it.
        artifactContentType: "application/zip" # if empty defaults to raw
        replacesArtifacts: true # will update existing release assets if needed.
        omitBodyDuringUpdate: true # don't edit release body when published via webui
        artifacts: ./artifact/ninja-mac.zip # release asset
